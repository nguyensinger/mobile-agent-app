name: it_support_agent_app
description: IT Support Agent App - tiếp nhận và xử lý ticket support khách hàng
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.0.0                      # HTTP client gọi REST API Odoo
  shared_preferences: ^2.0.0        # lưu config (base url, api key) cục bộ
  intl: ^0.20.2                      # định dạng ngày giờ
  firebase_core: ^3.0.0              # Firebase core (bắt buộc)
  firebase_messaging: ^15.0.0        # FCM push notification

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
